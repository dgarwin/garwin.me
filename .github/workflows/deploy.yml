name: Deploy

# Publishes the site to S3 and clears the CloudFront cache. Authenticates by
# assuming an IAM role through GitHub's OIDC provider, so there are no AWS
# access keys stored in this repository.
#
# Needs three repository variables (Settings -> Secrets and variables ->
# Actions -> Variables), all of which the infra/site.yml stack outputs:
#   AWS_DEPLOY_ROLE_ARN, SITE_BUCKET, CLOUDFRONT_DISTRIBUTION_ID

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys race each other onto the same bucket.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip rather than fail while the AWS side is not wired up yet.
    if: vars.SITE_BUCKET != '' && vars.AWS_DEPLOY_ROLE_ARN != ''
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload the site
        run: |
          # Everything in the repo is the site except the repo's own
          # scaffolding, so exclude that rather than listing pages: adding a
          # page needs no change here.
          aws s3 sync . "s3://${{ vars.SITE_BUCKET }}" \
            --delete \
            --no-progress \
            --cache-control "public, max-age=300" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "infra/*" \
            --exclude ".gitignore" \
            --exclude "README.md"

      - name: Clear the CloudFront cache
        run: |
          # One wildcard path counts as a single invalidation, and the first
          # 1,000 a month are free.
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query "Invalidation.Id" --output text
