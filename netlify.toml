# Static site — there is nothing to compile. The "build" stages the site files
# into public/ and publishes that.
#
# Why public/ and not the repo root: this site's Netlify UI still carries
# Publish directory = "public" from when the site was built with Hugo, and the
# deploy stage honors it even when netlify.toml resolves publish to the repo
# root (a deploy failed with "Deploy directory 'public' does not exist" while
# the resolved config showed /opt/build/repo). Producing public/ satisfies both
# the UI value and this file, so the deploy does not depend on a setting the
# repo cannot see.
#
# The staging copies every top-level site file rather than a named list, so
# adding a page or an image needs no change here. It then asserts index.html
# landed, so a staging mistake fails the build loudly instead of publishing an
# empty directory, and lists what shipped into the deploy log.
[build]
  command = 'mkdir -p public && find . -maxdepth 1 ! -name "." ! -name ".*" ! -name "public" ! -name "netlify.toml" ! -name "README.md" -exec cp -r {} public/ \; && test -f public/index.html && ls -l public/'
  publish = "public"
