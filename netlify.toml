# Static site — there is nothing to compile. The "build" just stages the site
# files into public/.
#
# Why stage into public/ instead of publishing the repo root: this site's
# Netlify UI still has Publish directory = "public" from when the site was
# built with Hugo, and the deploy stage honors that even when netlify.toml
# resolves publish to the repo root. Producing public/ satisfies both, so the
# deploy works without depending on a UI setting.
[build]
  command = "mkdir -p public && cp index.html CNAME public/ && cp -r plain public/"
  publish = "public"

# /oh-no/ was this page's address before it became the homepage.
[[redirects]]
  from = "/oh-no/*"
  to = "/"
  status = 301
