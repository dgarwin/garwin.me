AWSTemplateFormatVersion: "2010-09-09"

Description: >
  garwin.me static site: a private S3 bucket served through CloudFront over
  HTTPS, plus an optional IAM role that lets GitHub Actions deploy to it
  without long-lived access keys.

  Deploy this stack in us-east-1. CloudFront requires its ACM certificate to
  live in us-east-1, and keeping the bucket in the same region keeps the
  runbook simple.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Site" }
        Parameters: [DomainNames, AcmCertificateArn, HostedZoneId]
      - Label: { default: "Deploy access" }
        Parameters: [GitHubRepo, CreateGitHubOidcProvider]
    ParameterLabels:
      DomainNames: { default: "Domain names served by CloudFront" }
      AcmCertificateArn: { default: "ACM certificate ARN (must be us-east-1)" }
      HostedZoneId: { default: "Route 53 hosted zone ID (optional)" }
      GitHubRepo: { default: "GitHub repository allowed to deploy" }
      CreateGitHubOidcProvider: { default: "Create the GitHub OIDC provider?" }

Parameters:
  DomainNames:
    Type: CommaDelimitedList
    Default: "garwin.me,www.garwin.me"
    Description: >
      Domains the distribution answers for. Every name here must be covered by
      the certificate below.

  AcmCertificateArn:
    Type: String
    Description: >
      ARN of an ACM certificate in us-east-1 covering every name in
      DomainNames. Certificates are free; see the README for how to request
      and validate one.
    AllowedPattern: "^arn:aws[a-zA-Z-]*:acm:us-east-1:[0-9]{12}:certificate/.+$"
    ConstraintDescription: must be an ACM certificate ARN in us-east-1

  HostedZoneId:
    Type: String
    Default: ""
    Description: >
      Optional. If you host DNS in Route 53, give the zone ID and this stack
      creates the A/AAAA alias records for you. Leave empty to point DNS at
      the distribution yourself. An apex domain needs Route 53 (or another
      provider with ALIAS/ANAME support), because CloudFront has no fixed IPs
      to put in an A record.

  CreateWwwRecords:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >
      Also create Route 53 alias records for www.<apex>. Only applies when
      HostedZoneId is set, and www must be covered by the certificate.

  GitHubRepo:
    Type: String
    Default: "dgarwin/garwin.me"
    Description: owner/repo permitted to assume the deploy role.

  CreateGitHubOidcProvider:
    Type: String
    Default: "yes"
    AllowedValues: ["yes", "no"]
    Description: >
      Say no if this account already has the token.actions.githubusercontent.com
      OIDC provider; there can only be one per account.

Conditions:
  UseRoute53: !Not [!Equals [!Ref HostedZoneId, ""]]
  UseWww: !And
    - !Not [!Equals [!Ref HostedZoneId, ""]]
    - !Equals [!Ref CreateWwwRecords, "yes"]
  MakeOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "yes"]

Resources:
  # ---------------------------------------------------------------- storage
  SiteBucket:
    Type: AWS::S3::Bucket
    # Keep the bucket if the stack is deleted, so a teardown cannot quietly
    # take the site's contents with it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # No public access at all: CloudFront reaches the bucket with a signed
      # request via Origin Access Control, and nothing else can read it.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  # ---------------------------------------------------------------- delivery
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Two jobs, both of which plain S3-behind-CloudFront cannot do on its own:
  # resolve directory URLs to index.html, and keep the old /oh-no/ address
  # working. Free within CloudFront Functions' 2M invocations a month.
  RequestRouter:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-router"
      AutoPublish: true
      FunctionConfig:
        Comment: Directory indexes and the /oh-no/ redirect
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          // /oh-no/ was this site's address before it became the homepage.
          if (uri === '/oh-no' || uri.indexOf('/oh-no/') === 0) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { 'location': { value: '/' } }
            };
          }

          // S3 serves objects, not directories: map /plain/ to /plain/index.html.
          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') <= uri.lastIndexOf('/')) {
            // No file extension in the last path segment, so treat it as a
            // directory: /plain -> /plain/index.html
            request.uri = uri + '/index.html';
          }

          return request;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} static site"
        Aliases: !Ref DomainNames
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        # North America and Europe only. The cheapest price class, and the
        # edge locations it drops are ones this site's traffic will not miss.
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        # A private bucket answers 403 for a key that does not exist, which
        # reaches the viewer as raw S3 XML. Serve the homepage instead, still
        # with a 404 status.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 300
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RequestRouter.FunctionARN

  # ---------------------------------------------------------------- dns
  ApexAlias:
    Type: AWS::Route53::RecordSetGroup
    Condition: UseRoute53
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Select [0, !Ref DomainNames]
          Type: A
          AliasTarget: &cloudfrontAlias
            # Fixed, documented zone ID for every CloudFront distribution.
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt SiteDistribution.DomainName
            EvaluateTargetHealth: false
        - Name: !Select [0, !Ref DomainNames]
          Type: AAAA
          AliasTarget: *cloudfrontAlias

  WwwAlias:
    Type: AWS::Route53::RecordSetGroup
    Condition: UseWww
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Sub
            - "www.${Apex}"
            - Apex: !Select [0, !Ref DomainNames]
          Type: A
          AliasTarget: &wwwCloudfrontAlias
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt SiteDistribution.DomainName
            EvaluateTargetHealth: false
        - Name: !Sub
            - "www.${Apex}"
            - Apex: !Select [0, !Ref DomainNames]
          Type: AAAA
          AliasTarget: *wwwCloudfrontAlias

  # ---------------------------------------------------------------- deploy access
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # Since July 2024 IAM verifies GitHub's endpoint against its own library
      # of trusted CAs and ignores this thumbprint, but CloudFormation still
      # expects the property, so a stale value here is harmless.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets GitHub Actions publish the site. No long-lived keys.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Only this repository, and only its default branch.
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/master"
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                Resource: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

Outputs:
  BucketName:
    Description: Set this as the SITE_BUCKET repository variable.
    Value: !Ref SiteBucket
  DistributionId:
    Description: Set this as the CLOUDFRONT_DISTRIBUTION_ID repository variable.
    Value: !Ref SiteDistribution
  DeployRoleArn:
    Description: Set this as the AWS_DEPLOY_ROLE_ARN repository variable.
    Value: !GetAtt DeployRole.Arn
  DistributionDomainName:
    Description: >
      Point DNS here if you are not using Route 53. A subdomain can CNAME to
      this; an apex domain needs an ALIAS/ANAME-capable provider.
    Value: !GetAtt SiteDistribution.DomainName
