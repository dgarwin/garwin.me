<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to garwin.me</title>
<!-- This was the site's address before it became the homepage. GitHub Pages
     serves static files only and cannot issue a 301, so this page stands in
     for the redirect: the canonical link tells crawlers where the content
     actually lives, and the refresh moves a reader along. -->
<link rel="canonical" href="https://garwin.me/">
<meta http-equiv="refresh" content="0; url=/">
<meta name="robots" content="noindex">
<style>
  body {
    margin: 0;
    padding: 40px 16px;
    background: #000;
    color: #fff;
    font-family: "Courier New", Courier, monospace;
    font-size: 15px;
    text-align: center;
  }
  a { color: #00ffff; }
</style>
</head>
<body>
  <p>This moved to <a href="/">garwin.me</a>.</p>
</body>
</html>
